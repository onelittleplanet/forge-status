<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge status</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Whether Forge's sign-in, remote access and web app are working.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="fonts/geist-300.woff2" crossorigin>
<style>
@font-face { font-family: 'Geist'; font-weight: 300; font-display: swap; src: url(fonts/geist-300.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 400; font-display: swap; src: url(fonts/geist-400.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 500; font-display: swap; src: url(fonts/geist-500.woff2) format('woff2'); }

:root {
  --paper: #ffffff;
  --ink: #17161a;
  --ink-2: #4b4a50;
  --ink-3: #8a888f;
  --line: #ececee;
  --up: hsl(175 55% 38%);
  --down: hsl(0 72% 51%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: hsl(220 10% 11%);
    --ink: hsl(220 5% 90%);
    --ink-2: hsl(220 5% 74%);
    --ink-3: hsl(220 5% 56%);
    --line: hsl(220 8% 19%);
    --up: hsl(175 50% 52%);
    --down: hsl(0 80% 64%);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink-3); outline-offset: 3px; border-radius: 4px; }

main { max-width: 640px; margin: 0 auto; padding: 32px 24px 80px; }

.wm { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
.wm img { width: 22px; height: 22px; }

.state { margin: 18vh 0 56px; font-weight: 300; font-size: clamp(40px, 10vw, 72px); line-height: 1; letter-spacing: -0.045em; text-wrap: balance; }
.state .light { color: var(--up); }
.state.is-down .light { color: var(--down); }

.services { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.service { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 24px; row-gap: 2px; padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 17px; }
.service .name { display: flex; align-items: baseline; gap: 12px; min-width: 0; max-width: 100%; font-weight: 500; letter-spacing: -0.01em; }
.service .mark { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--up); transform: translateY(-2px); }
.service .when { min-width: 0; max-width: 100%; padding-left: 20px; color: var(--ink-3); }
.service .word { color: var(--up); }
.service.is-down .mark { background: var(--down); }
.service.is-down .word { color: var(--down); font-weight: 500; }

.checked { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-3); }

h2 { margin: 72px 0 8px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.incidents { list-style: none; margin: 0; padding: 0; }
.incident { padding: 18px 0; border-bottom: 1px solid var(--line); }
.incident:last-child { border-bottom: 0; }
.incident .title { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.35; letter-spacing: -0.01em; }
.incident .span { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-3); }
.incident .span .open { color: var(--down); }
.incident .note { margin: 8px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink-2); max-width: 60ch; }
.none { margin: 12px 0 0; font-size: 15px; color: var(--ink-3); }

/* A line that does not fit fades out at its end, never cut or ended with an ellipsis (Forge's .text-fade-edge). */
@keyframes fade-edge { from, to { mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); } }
.fade { overflow: hidden; white-space: nowrap; animation: fade-edge linear both; animation-timeline: scroll(self inline); }
@supports not (animation-timeline: scroll()) {
  .fade { animation: none; mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent); }
}

.page { opacity: 0; transition: opacity .35s ease-out; }
.page.ready { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .page { transition: none; } }

@media (max-width: 520px) {
  main { padding: 24px 20px 64px; }
  .state { margin: 12vh 0 40px; }
  .service { font-size: 16px; }
}
</style>
</head>
<body>
<main>
  <a class="wm" href="https://forgeforward.dev"><img src="favicon.svg" alt="">Forge status</a>
  <div class="page" id="page">
    <h1 class="state" id="state"></h1>
    <ul class="services" id="services"></ul>
    <p class="checked" id="checked"></p>
    <h2>Incidents</h2>
    <ul class="incidents" id="incidents"></ul>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function duration(seconds) {
  const m = Math.floor(seconds / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 2) return `${d} days`;
  if (h >= 1) return m % 60 ? `${h} h ${m % 60} min` : `${h} h`;
  if (m >= 1) return `${m} min`;
  return 'under a minute';
}

function ago(seconds) {
  const m = Math.floor(seconds / 60);
  if (m < 1) return 'Checked just now';
  if (m < 60) return `Checked ${m} minute${m === 1 ? '' : 's'} ago`;
  const h = Math.floor(m / 60);
  return `Checked ${h} hour${h === 1 ? '' : 's'} ago`;
}

function list(names) {
  return names.length < 2 ? names.join('') : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
}

const day = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const time = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
const zone = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' });
const zoneName = (d) => zone.formatToParts(d).find((p) => p.type === 'timeZoneName')?.value ?? '';

function span(incident) {
  const start = new Date(incident.start);
  const out = el('p', 'span');
  if (!incident.end) {
    out.append(`${day.format(start)}, from ${time.format(start)} ${zoneName(start)}, `, el('span', 'open', 'ongoing'));
    return out;
  }
  const end = new Date(incident.end);
  const sameDay = day.format(start) === day.format(end);
  out.textContent = sameDay
    ? `${day.format(start)}, ${time.format(start)} – ${time.format(end)} ${zoneName(end)}`
    : `${day.format(start)}, ${time.format(start)} – ${day.format(end)}, ${time.format(end)} ${zoneName(end)}`;
  return out;
}

function render(status, incidents) {
  const now = Date.now() / 1000;
  const state = $('state');
  const down = status.services.filter((s) => !s.up);
  state.className = down.length ? 'state is-down' : 'state';
  const words = down.length
    ? `${list(down.map((s, i) => (i === 0 ? s.name : s.name.toLowerCase())))} ${down.length === 1 ? 'is' : 'are'} down`
    : 'Everything is working';
  state.replaceChildren(words, el('span', 'light', '.'));

  $('services').replaceChildren(...status.services.map((s) => {
    const row = el('li', s.up ? 'service' : 'service is-down');
    const name = el('span', 'name');
    name.append(el('span', 'mark'), el('span', 'fade', s.name));
    const when = el('span', 'when fade');
    when.append(el('span', 'word', s.up ? 'Working' : 'Down'), ` for ${duration(now - s.since)}`);
    row.append(name, when);
    return row;
  }));
  $('checked').textContent = ago(now - status.checked);

  const recent = [...incidents].sort((a, b) => b.start.localeCompare(a.start)).slice(0, 10);
  $('incidents').replaceChildren(...(recent.length ? recent.map((i) => {
    const row = el('li', 'incident');
    row.append(el('p', 'title', i.title), span(i));
    if (i.note) row.append(el('p', 'note', i.note));
    return row;
  }) : [el('li', 'none', 'No incidents.')]));
}

async function load() {
  try {
    const [status, incidents] = await Promise.all(['status.json', 'incidents.json'].map((f) => fetch(f, { cache: 'no-store' }).then((r) => {
      if (!r.ok) throw new Error(f);
      return r.json();
    })));
    render(status, incidents);
  } catch {
    $('state').className = 'state';
    $('state').textContent = 'Status unavailable';
  }
  $('page').classList.add('ready');
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
